name: Build speedybeef4v3 baro fix

on:
  push:
    branches: [fix/speedybeef4v3-baro]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Configure
        shell: bash
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
          export PATH="/opt/gcc-arm-none-eabi-10/bin:$PATH"
          ./waf configure --board speedybeef4v3

      - name: Build Copter
        shell: bash
        run: |
          export PATH="/opt/gcc-arm-none-eabi-10/bin:$PATH"
          ./waf copter

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: arducopter-speedybeef4v3
          path: |
            build/speedybeef4v3/bin/arducopter.apj
            build/speedybeef4v3/bin/arducopter_with_bl.hex
          if-no-files-found: error
